
name: Build Mesa D3D12 for AlmaLinux 8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: almalinux:8.10

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools

          dnf install -y \
            gcc-toolset-12-gcc \
            gcc-toolset-12-gcc-c++ \
            gcc-toolset-12-binutils \
            make cmake git \
            ninja-build \
            pkgconf-pkg-config \
            python3.11 python3.11-pip \
            python3.11-devel \
            bison flex \
            curl tar xz \
            llvm-devel llvm \
            clang \
            glibc-devel \
            libdrm-devel \
            expat-devel \
            zlib-devel \
            libzstd-devel \
            elfutils-libelf-devel \
            libffi-devel \
            libX11-devel \
            libXext-devel \
            libXfixes-devel \
            libXdamage-devel \
            libXrandr-devel \
            libXxf86vm-devel \
            libxshmfence-devel \
            libxcb-devel \
            libxkbcommon-devel \
            xorg-x11-proto-devel \
            wayland-devel \
            wayland-protocols-devel

          python3.11 -m venv /opt/build-venv

          /opt/build-venv/bin/pip install \
            meson==1.3.2 \
            mako packaging pyyaml

      - name: Build DirectX Headers
        run: |
          source /opt/rh/gcc-toolset-12/enable

          git clone --depth 1 \
            --branch v1.610.0 \
            https://github.com/microsoft/DirectX-Headers.git \
            /tmp/DirectX-Headers

          cmake \
            -S /tmp/DirectX-Headers \
            -B /tmp/DirectX-Headers/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local

          cmake --build /tmp/DirectX-Headers/build -j2
          cmake --install /tmp/DirectX-Headers/build

      - name: Download Mesa
        run: |
          mkdir -p /tmp/mesa-source
          cd /tmp/mesa-source

          curl -fL --retry 3 \
            https://archive.mesa3d.org/mesa-23.1.4.tar.xz \
            -o mesa.tar.xz

          echo "7261a17fb94867e3dc5a90d8a1f100fa04b0cbbde51d25302c0872b5e9a10959  mesa.tar.xz" \
            | sha256sum -c -

          tar -xf mesa.tar.xz

      - name: Configure Mesa
        run: |
          source /opt/rh/gcc-toolset-12/enable
          source /opt/build-venv/bin/activate

          export PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig

          cd /tmp/mesa-source/mesa-23.1.4

          meson setup build \
            --prefix=/opt/mesa-d3d12 \
            --libdir=lib64 \
            --buildtype=release \
            -Dplatforms=x11 \
            -Dgallium-drivers=d3d12,swrast \
            -Dvulkan-drivers=[] \
            -Dglx=dri \
            -Dglvnd=false \
            -Degl=enabled \
            -Dllvm=enabled \
            -Dshared-llvm=enabled \
            -Dgallium-va=disabled \
            -Dgallium-vdpau=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-nine=false

      - name: Compile Mesa
        run: |
          source /opt/rh/gcc-toolset-12/enable
          source /opt/build-venv/bin/activate

          cd /tmp/mesa-source/mesa-23.1.4

          ninja -C build -j2

          ninja -C build install

      - name: Inspect build
        run: |
          ls -lh /opt/mesa-d3d12/lib64/
          ls -lh /opt/mesa-d3d12/lib64/dri/

          ldd /opt/mesa-d3d12/lib64/libGL.so.1

          ldd /opt/mesa-d3d12/lib64/dri/swrast_dri.so

      - name: Package Mesa
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          tar -czf \
            "$GITHUB_WORKSPACE/output/mesa-d3d12-almalinux8.tar.gz" \
            -C /opt mesa-d3d12

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: mesa-d3d12-almalinux8
          path: output/mesa-d3d12-almalinux8.tar.gz
          retention-days: 7
